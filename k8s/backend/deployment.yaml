apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: 834922934330.dkr.ecr.ap-northeast-3.amazonaws.com/team01-course-registration-backend:placeholder
          ports:
            - containerPort: 8080